<text x="736" y="87" class="serif" font-style="italic" font-weight="700" font-size="24" fill="#141414">“If you win, you live. If you</text><text x="736" y="119" class="serif" font-style="italic" font-weight="700" font-size="24" fill="#141414">lose, you die. If you don't</text><text x="736" y="151" class="serif" font-style="italic" font-weight="700" font-size="24" fill="#141414">fight, you can't win!”</text>
