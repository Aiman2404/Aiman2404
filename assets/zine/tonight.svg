-0.63s"><g transform="translate(230.5 0) rotate(-4.5)"><path d="M-17.1 -27.2 L20.7 -27.2 L20.5 28.5 L-18.8 28.7Z" fill="#141414"/><text y="16.8" text-anchor="middle" font-family='Georgia,"Times New Roman",serif' font-weight="700" font-size="41.9" fill="#f3701e">L</text></g></g><g class="jit" style="animation-delay:-1.54s"><g transform="translate(261 -0.9) rotate(4.3)"><path d="M-7.5 -21.1 L0 -21.9 L8.9 -21.7 L8 21.6 L0.4 21.6 L-8.1 21.9Z" fill="#141414"/><text y="13.2" text-anchor="middle" font-family='"Trebuchet MS",sans-serif' font-weight="700" font-size="34.5" fill="#fbf8f2">I</text></g></g><g class="jit" style="animation-delay:-0.18s"><g transform="translate(288.7 1.7) rotate(-1.5)"><path d="M-16.9 -24.9 L17.5 -24.8 L15.9 24.6 L0.7 24.7 L-16.8 26.5Z" fill="#fbf8f2"/><text y="15.9" text-anchor="middle" font-family='"Arial Black",Arial,sans-serif' font-weight="700" font-size="40.7" fill="#141414">N</text></g></g><g class="jit" style="animation-delay:-0.98s"><g transform="translate(322.2 0.2) rotate(-1.9)"><path d="M-12.9 -20.7 L-1.3 -19 L13.2 -19 L14.2 20.2 L0.6 20 L-15.4 19.9Z" fill="#fbf8f2"/><text y="12.4" text-anchor="middle" font-family='Verdana,Geneva,sans-serif' font-weight="700" font-size="34.2" fill="#141414">E</text></g></g></g>
<g transform="translate(300 160) rotate(-1.5)"><rect x="-6" y="-17" width="162.6" height="26" fill="#ece0cf"/><text x="6" y="2" class="mono" font-size="17" fill="#141414" letter-spacing="2">TAME IMPALA</text></g>
<text x="300" y="212" class="mono" font-size="11" fill="#888" letter-spacing="2">CLICK TO PLAY · CHANGES DAILY</text>
