<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Now spinning: Borderline by Tame Impala. People's dreams... never end! — Marshall D. Teach"><defs>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer></filter>
<pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.7" fill="#4b607f"/></pattern>
<pattern id="dotsInk" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="#141414"/></pattern>
<pattern id="check" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#fbf8f2"/><rect width="10" height="10" fill="#141414"/><rect x="10" y="10" width="10" height="10" fill="#141414"/></pattern>
<style>
.jit{animation:jit .9s steps(1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes jit{0%{transform:none}33%{transform:translate(1px,-1.5px) rotate(1.2deg)}66%{transform:translate(-1px,1px) rotate(-.8deg)}}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.mono{font-family:"Courier New",Courier,monospace;font-weight:700}
.serif{font-family:Georgia,"Times New Roman",serif}
.heavy{font-family:Impact,"Arial Black",sans-serif}
.arm{animation:arm 6s ease-in-out infinite;transform-origin:0 0}@keyframes arm{50%{transform:rotate(3deg)}}
</style></defs>
<rect width="1200" height="250" fill="#141414"/>
<g transform="translate(140 125)"><circle r="104" fill="#0a0a0a"/><g class="spin" style="animation-duration:2.4s"><circle r="96" fill="none" stroke="#262626" stroke-width="1.3"/><circle r="84" fill="none" stroke="#262626" stroke-width="1.3"/><circle r="72" fill="none" stroke="#262626" stroke-width="1.3"/><circle r="60" fill="none" stroke="#262626" stroke-width="1.3"/><circle r="50" fill="none" stroke="#262626" stroke-width="1.3"/><circle r="38" fill="#f3701e"/><text y="-6" text-anchor="middle" class="mono" font-size="9" fill="#141414">SIDE A</text><text y="14" text-anchor="middle" class="mono" font-size="9" fill="#141414">33 RPM</text><path d="M-90 -30 Q-60 -80 0 -96" fill="none" stroke="#666" stroke-width="2" opacity=".5"/></g><circle r="4" fill="#ece0cf"/></g>
<g transform="translate(262 26)"><g class="arm"><circle r="12" fill="#666"/><path d="M0 0 L-38 118 L-54 132" stroke="#ece0cf" stroke-width="5" fill="none" stroke-linecap="round"/></g></g>
<text x="300" y="74" class="mono" font-size="13" fill="#f3701e" letter-spacing="4">● NOW SPINNING</text>
<text x="300" y="122" class="serif" font-weight="700" font-size="40" fill="#fbf8f2">Borderline</text>
<text x="300" y="156" class="mono" font-size="17" fill="#ece0cf" letter-spacing="2">TAME IMPALA</text>
<text x="300" y="200" class="mono" font-size="11" fill="#888" letter-spacing="2">CLICK TO PLAY · CHANGES DAILY</text>
<g transform="rotate(-2 940 125)"><path d="M700 31 L1172 23 L1180 215 L708 223 Z" fill="#f4ecdf"/>
<rect x="885" y="14" width="110" height="22" fill="rgba(236,224,207,.82)" transform="rotate(3 940 25)" opacity=".9"/>
<text x="736" y="100" class="serif" font-style="italic" font-weight="700" font-size="30" fill="#141414">“People's dreams... never</text><text x="736" y="138" class="serif" font-style="italic" font-weight="700" font-size="30" fill="#141414">end!”</text>
<text x="1150" y="203" text-anchor="end" class="mono" font-size="14" fill="#d42a1f" letter-spacing="2">— MARSHALL D. TEACH</text></g>
<rect width="1200" height="250" filter="url(#grain)" pointer-events="none"/></svg>