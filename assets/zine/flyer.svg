="translate(785.6 91.6) rotate(-1.0)"><path d="M-23.5 -38.5 L-0.6 -36.6 L24.1 -36.7 L23 40.7 L-23.5 37.3Z" fill="#f3701e"/><text y="23.5" text-anchor="middle" font-family='Impact,"Arial Black",sans-serif' font-weight="700" font-size="61" fill="#141414">E</text></g></g>
