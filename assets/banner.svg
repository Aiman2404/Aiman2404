<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="AJ — 何でも屋 — jack of all trades">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07061a"/>
      <stop offset=".55" stop-color="#1a0f3a"/>
      <stop offset=".78" stop-color="#4a1d4f"/>
      <stop offset="1" stop-color="#0a0818"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="232" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb36b" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#ff5f8f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff5f8f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf8a"/>
      <stop offset=".5" stop-color="#ff5f8f"/>
      <stop offset="1" stop-color="#6ff3e4"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c2a"/>
      <stop offset="1" stop-color="#05040d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe2b8"/>
      <stop offset=".5" stop-color="#ffb0c8"/>
      <stop offset="1" stop-color="#a8fff3"/>
    </linearGradient>
    <clipPath id="above"><rect width="1200" height="262"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <style>
      .rip { fill: none; stroke: url(#ring); stroke-width: 1.4; transform-origin: 600px 232px; animation: rip 9s linear infinite; opacity: 0; }
      .rip:nth-child(2) { animation-delay: -1.5s } .rip:nth-child(3) { animation-delay: -3s }
      .rip:nth-child(4) { animation-delay: -4.5s } .rip:nth-child(5) { animation-delay: -6s }
      .rip:nth-child(6) { animation-delay: -7.5s }
      @keyframes rip { 0% { transform: scale(.12); opacity: 0 } 12% { opacity: .75 } 100% { transform: scale(1.9); opacity: 0 } }
      .sun { transform-origin: 600px 232px; animation: breathe 6s ease-in-out infinite; }
      @keyframes breathe { 50% { transform: scale(1.06) } }
      .star { fill: #ffe9cf; animation: tw 4s ease-in-out infinite; }
      @keyframes tw { 50% { opacity: .15 } }
      .dash { stroke: #ffd59a; stroke-width: 3; stroke-dasharray: 14 22; animation: drive 1.1s linear infinite; }
      @keyframes drive { to { stroke-dashoffset: -36 } }
      .tail { animation: tail 7s ease-in infinite; }
      @keyframes tail { 0% { transform: translate(0,0) scale(1); opacity: 0 } 10% { opacity: 1 } 100% { transform: translate(0,-96px) scale(.15); opacity: 0 } }
      .kanji { font: 600 30px "Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif; fill: #ffcf9a; letter-spacing: 6px; }
      .name { font: 700 92px Georgia,"Times New Roman",serif; letter-spacing: 22px; fill: url(#title); }
      .sub { font: 500 15px ui-monospace,"Cascadia Code",Consolas,monospace; fill: #f6dccb; letter-spacing: 4px; }
      .tiny { font: 500 11px ui-monospace,Consolas,monospace; fill: #b9a6d6; letter-spacing: 3px; }
      .flick { animation: flick 5s steps(1) infinite; }
      @keyframes flick { 0%,100% { opacity: 1 } 47% { opacity: .35 } 49% { opacity: 1 } 51% { opacity: .5 } 53% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#sky)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="80" cy="40" r="1.2"/><circle class="star" cx="190" cy="92" r="1" style="animation-delay:-1s"/>
    <circle class="star" cx="260" cy="30" r="1.5" style="animation-delay:-2.2s"/><circle class="star" cx="355" cy="70" r="1"/>
    <circle class="star" cx="470" cy="22" r="1.3" style="animation-delay:-3s"/><circle class="star" cx="735" cy="34" r="1.1" style="animation-delay:-.6s"/>
    <circle class="star" cx="842" cy="80" r="1.6" style="animation-delay:-1.7s"/><circle class="star" cx="930" cy="26" r="1" style="animation-delay:-2.8s"/>
    <circle class="star" cx="1035" cy="64" r="1.3"/><circle class="star" cx="1130" cy="36" r="1.1" style="animation-delay:-1.3s"/>
    <circle class="star" cx="140" cy="150" r=".9" style="animation-delay:-3.4s"/><circle class="star" cx="1090" cy="140" r=".9" style="animation-delay:-2s"/>
    <!-- a small original constellation: the wanderer -->
    <g stroke="#ffd9b0" stroke-opacity=".35" stroke-width=".8" fill="none"><path d="M1010 110 L1042 96 L1070 112 L1098 92 L1124 104"/></g>
    <circle class="star" cx="1010" cy="110" r="1.7"/><circle class="star" cx="1042" cy="96" r="1.4" style="animation-delay:-1s"/>
    <circle class="star" cx="1070" cy="112" r="2" style="animation-delay:-2s"/><circle class="star" cx="1098" cy="92" r="1.4" style="animation-delay:-3s"/>
    <circle class="star" cx="1124" cy="104" r="1.6" style="animation-delay:-.5s"/>
  </g>

  <!-- psychedelic ripples rising from the horizon -->
  <rect width="1200" height="262" fill="url(#glow)"/>
  <g clip-path="url(#above)">
    <g>
      <circle class="rip" cx="600" cy="232" r="150"/><circle class="rip" cx="600" cy="232" r="150"/>
      <circle class="rip" cx="600" cy="232" r="150"/><circle class="rip" cx="600" cy="232" r="150"/>
      <circle class="rip" cx="600" cy="232" r="150"/><circle class="rip" cx="600" cy="232" r="150"/>
    </g>
    <g class="sun">
      <circle cx="600" cy="232" r="54" fill="#ffb36b" opacity=".9" filter="url(#soft)"/>
      <circle cx="600" cy="232" r="46" fill="#ffd9a3"/>
    </g>
  </g>

  <!-- mountains -->
  <path d="M0 262 L70 220 L120 238 L190 196 L250 230 L320 206 L380 240 L430 224 L480 262 Z" fill="#120a26"/>
  <path d="M720 262 L770 228 L830 244 L900 200 L960 232 L1020 210 L1090 238 L1150 214 L1200 236 L1200 262 Z" fill="#120a26"/>

  <!-- the road -->
  <path d="M0 262 H1200 V380 H0 Z" fill="url(#road)"/>
  <path d="M592 262 L230 380 H970 L608 262 Z" fill="#1b1233"/>
  <path d="M592 262 L230 380" stroke="#ff7fa8" stroke-opacity=".55" stroke-width="2"/>
  <path d="M608 262 L970 380" stroke="#6ff3e4" stroke-opacity=".55" stroke-width="2"/>
  <path class="dash" d="M600 380 L600 262"/>
  <!-- tail lights drifting toward the horizon -->
  <g class="tail" style="transform-origin:640px 360px">
    <circle cx="628" cy="360" r="3.5" fill="#ff3b5c"/><circle cx="652" cy="360" r="3.5" fill="#ff3b5c"/>
    <circle cx="640" cy="360" r="16" fill="#ff3b5c" opacity=".15"/>
  </g>
  <line x1="0" y1="262" x2="1200" y2="262" stroke="#ffb36b" stroke-opacity=".5"/>

  <!-- type -->
  <text class="name" x="600" y="128" text-anchor="middle">AJ</text>
  <text class="kanji flick" x="58" y="120" writing-mode="tb" style="writing-mode:vertical-rl">何でも屋</text>
  <text class="sub" x="600" y="164" text-anchor="middle">HARDWARE · SOFTWARE · WHATEVER'S BROKEN</text>
  <text class="tiny" x="60" y="360">TRACK 01 — SIDE A</text>
</svg>
